[project]
name = "backend"
version = "0.1.0"
description = "AIQ data pipeline + protocol + API (FastAPI local, Lambda prod)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "httpx>=0.27",
  "numpy>=2.0",
  "opencv-python-headless>=4.0",
  "strands-agents>=1.0",
  # Cedar tool-gate inside agents needs the extra:
  # pip install "strands-agents[cedar]"
  # Prod Verified Permissions consumes app/authz/*.cedar as-is.
]
